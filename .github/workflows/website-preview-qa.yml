name: TradeBridge Website Preview QA
on:
  push:
    branches:
      - website-modernization-v1-approved

permissions:
  contents: read

jobs:
  static-and-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify HTML, assets, SEO, and approved visuals
        run: python3 tests/validate_site.py
      - name: Verify JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/site-config.js
          node --check api/_common.js
          node --check api/intake.js
          node --check api/newsletter.js
      - name: Test intake validation and safe failure states
        run: node --test tests/api.test.cjs

  browser-and-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned browser QA packages
        run: npm install --no-save --package-lock=false playwright@1.56.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render and test six screen widths, routes, and accessibility
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tradebridge-test-http.log 2>&1 &
          TEST_SERVER_PID=$!
          trap 'kill "$TEST_SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node tests/browser-qa.cjs
      - name: Preserve QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tradebridge-preview-qa-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
