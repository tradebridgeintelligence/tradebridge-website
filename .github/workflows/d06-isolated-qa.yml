name: D06 Isolated Source and Browser QA (No Deploy)
on:
  push:
    branches:
      - command-d06-20261021-phase1-frontend
permissions:
  contents: write
concurrency:
  group: d06-website-qa
  cancel-in-progress: false
jobs:
  d06-source-only:
    if: github.ref == 'refs/heads/command-d06-20261021-phase1-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout authorized branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Pin reviewed Node runtime for this source-only CI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Verify syntax, release contract, negative cases and browser under local server
        run: |
          set +e
          node --check assets/site.js &&
          node --check scripts/build-render-static.cjs &&
          node --check api/newsletter.js &&
          node --check api/intake.js &&
          node --check tests/frontend-release.test.cjs &&
          node --check tests/api.test.cjs
          node --check tests/d06-header-candidate.test.cjs
          syntax=$?
          python3 tests/validate_site.py
          static=$?
          node --test tests/api.test.cjs tests/frontend-release.test.cjs tests/d06-header-candidate.test.cjs
          negative=$?
          browser=99
          if [ "$syntax" -eq 0 ] && [ "$static" -eq 0 ] && [ "$negative" -eq 0 ]; then
            npm install --no-save --package-lock=false --ignore-scripts --no-fund --no-audit playwright@1.56.0 @axe-core/playwright@4.10.2
            installed=$?
            if [ "$installed" -eq 0 ]; then
              npx playwright install --with-deps chromium
              installed=$?
            fi
            if [ "$installed" -eq 0 ]; then
              python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tradebridge-d06-static.log 2>&1 &
              server_pid=$!
              sleep 2
              node tests/browser-qa.cjs
              browser=$?
              kill "$server_pid" 2>/dev/null || true
            else
              browser=98
            fi
          fi
          {
            echo '# D06 Frontend Isolated QA Evidence'
            echo
            echo 'Scope: isolated website source only; no deploy, Render action, DNS or production release'
            echo "Source workflow commit: ${GITHUB_SHA}"
            echo "Node version: $(node --version)"
            echo "Syntax exit: $syntax"
            echo "Static contract exit: $static"
            echo "Phase One negative/API/headers candidate exit: $negative"
            echo "Local browser and accessibility exit: $browser"
            echo 'Browser width coverage: 1440,1280,1024,768,390,320 when executed'
            echo 'Consent: no newsletter, no optional GA4; first-party inquiry attribution retained'
          } > D06_FRONTEND_CI_EVIDENCE.md
          if [ "$syntax" -eq 0 ] && [ "$static" -eq 0 ] && [ "$negative" -eq 0 ] && [ "$browser" -eq 0 ]; then
            echo 'RESULT: SOURCE QA PASS (not production acceptance)' >> D06_FRONTEND_CI_EVIDENCE.md
          else
            echo 'RESULT: SOURCE QA FAIL/BLOCKED - correct changed paths before release' >> D06_FRONTEND_CI_EVIDENCE.md
          fi
      - name: Persist branch-local evidence without deploying
        env:
          BRANCH: command-d06-20261021-phase1-frontend
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          git add -- D06_FRONTEND_CI_EVIDENCE.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'D06 W02: record source-only static and local browser QA result'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          grep -Fq 'RESULT: SOURCE QA PASS' D06_FRONTEND_CI_EVIDENCE.md
