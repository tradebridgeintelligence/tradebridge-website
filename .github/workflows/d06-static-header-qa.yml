name: D06 Static Header Candidate Contract - No Deploy
on:
  push:
    branches:
      - command-d06-20261021-phase1-frontend
    paths:
      - .github/workflows/d06-static-header-qa.yml
permissions:
  contents: write
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated frontend source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Use reviewed Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Validate proposed header profile locally
        run: |
          set +e
          node --check tests/d06-header-candidate.test.cjs
          syntax=$?
          node --test tests/d06-header-candidate.test.cjs
          tests=$?
          {
            echo "# D06 W05 Render static header candidate QA"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "GitHub Actions run: $GITHUB_RUN_ID"
            echo "Syntax exit: $syntax"
            echo "Header source contract test exit: $tests"
            echo "Live Render header change: NONE"
            echo "CSP mode: PROPOSED REPORT-ONLY; not enforced or measured"
            if [ "$syntax" -eq 0 ] && [ "$tests" -eq 0 ]; then
              echo "RESULT: PROPOSED HEADER SOURCE QA PASS; LIVE/PRODUCTION NOT ACCEPTED"
            else
              echo "RESULT: SOURCE TEST FAILURE/BLOCKED"
            fi
          } > D06_HEADERS_CANDIDATE_QA.md
      - name: Save nonsecret test evidence on isolated branch
        if: always()
        env:
          BRANCH: command-d06-20261021-phase1-frontend
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          if [ ! -f D06_HEADERS_CANDIDATE_QA.md ]; then
            printf '# D06 W05\n\nRESULT: BLOCKED (runner failed before test)\n' > D06_HEADERS_CANDIDATE_QA.md
          fi
          cp D06_HEADERS_CANDIDATE_QA.md /tmp/d06-header-result.md
          git fetch origin "refs/heads/$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp /tmp/d06-header-result.md D06_HEADERS_CANDIDATE_QA.md
          git add -- D06_HEADERS_CANDIDATE_QA.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'D06 W05: record source-only Render static header profile contract QA'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          grep -Fq 'RESULT: PROPOSED HEADER SOURCE QA PASS' D06_HEADERS_CANDIDATE_QA.md
