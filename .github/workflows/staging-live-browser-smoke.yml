name: TradeBridge Staging Browser Intake Smoke
on:
  push:
    branches: [website-modernization-v1-approved]
    paths: [.github/workflows/staging-live-browser-smoke.yml]
permissions:
  contents: read
jobs:
  staging-form:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Submit synthetic lead through rendered Start Here form
        env:
          STAGING_SITE: https://tradebridge-corporate-staging.onrender.com
          STAGING_API: https://tradebridge-website-intake-staging.onrender.com
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const pageResponse=await page.goto(process.env.STAGING_SITE+'/start/?utm_source=qa&utm_campaign=website_staging',{waitUntil:'networkidle',timeout:30000});
              assert.equal(pageResponse.status(),200);
              const config=await page.evaluate(()=>window.TRADEBRIDGE_CONFIG||{});
              assert.equal(config.intakeApiBaseUrl,process.env.STAGING_API+'/');
              const index=await page.locator('meta[name="robots"]').getAttribute('content');
              assert.match(index,/noindex/);
              console.log('PASS: staging Start Here serves configured API and noindex');
              const form=page.locator('#intake-form');
              await form.locator('#name').fill('Synthetic Browser Test');
              await form.locator('#email').fill('tradebridge-browser-test@example.invalid');
              await form.locator('#company').fill('TradeBridge QA Only');
              await form.locator('#goal').fill('Verifying safe integration of staging website to intake backend');
              await form.locator('#why-now').fill('Before corporate launch');
              await form.locator('#intent').selectOption('research');
              await form.locator('#timing').selectOption('now');
              await form.locator('#follow-up').check();
              assert.equal(await form.evaluate(el=>el.checkValidity()),true);
              const requestResponse=page.waitForResponse(r=>r.url()===process.env.STAGING_API+'/v1/intake'&&r.request().method()==='POST',{timeout:30000});
              await form.locator('button[type="submit"]').click();
              const apiResponse=await requestResponse;
              const apiJSON=await apiResponse.json();
              assert.equal(apiResponse.status(),200,'form POST rejected: '+(apiJSON?.error||apiResponse.status()));
              assert.equal(apiJSON.accepted,true);
              assert.match(apiJSON.record_id,/^[0-9a-f-]{36}$/i);
              await page.waitForURL('**/intake-received/',{timeout:15000});
              assert.equal(errors.length,0,'JavaScript errors: '+errors.join('; '));
              console.log('PASS: real browser cross-origin submission created an acknowledged intake record');
              console.log('PASS: user reached confirmed-receipt page; staging remains nonindexed');
              console.log('NOTE: internal OD lookup, production site, newsletter consent and downstream notification remain unverified.');
              await page.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error('BROWSER STAGING TEST FAILED:',String(e?.message||e).slice(0,500));process.exitCode=1});
          NODE
